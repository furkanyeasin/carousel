<!DOCTYPE html>
<html lang="en">

<head>
    <!--   meta start-->
    <meta charset="UTF-8">
    <meta name="title" content="Carousel | Slider ">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="bootstrap 5 Slider">
    <meta name="keywords" content="Carousel, bootstrap5">
    <meta name="robots" content="index, follow">
    <meta name="language" content="English">
    <meta name="author" content="Furkan Yeasin">
    <!--   meta end-->
    <!--    title -->
    <title>Bootstrap Carousel | Slider</title>
    <!--    favicon -->
    <link rel="icon" type="image/x-icon" href="img/logo.png">
    <!--    css start-->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <!--    css end-->
</head>

<body>
    <div class="container mt-5">
        <div class="carousel slide my-5" id="demo" data-bs-ride="carousel">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active"></button>
                <button type="button" data-bs-target="#demo" data-bs-slide-to="1"></button>
                <button type="button" data-bs-target="#demo" data-bs-slide-to="2"></button>
            </div>
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img class="d-block img-fluid" src="img/1.png" alt="">
                </div>
                <div class="carousel-item">
                    <img class="d-block img-fluid" src="img/2.png" alt="">
                </div>
                <div class="carousel-item">
                    <img class="d-block img-fluid" src="img/3.png" alt="">
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#demo" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#demo" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>
    </div>
    <!--js start-->
    <script src="js/bootstrap.bundle.js"></script>
    <script src="js/script.js"></script>
    <!--js end-->
</body></html>
